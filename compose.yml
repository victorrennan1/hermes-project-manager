services:
  agent:
    build: .
    # Installer never has to create a .env: a fixed AGENT_ID ships here so
    # every install's usage reports under this same agent on the leaderboard;
    # override only if you are running your own fork under your own id.
    environment:
      AGENT_ID: ${AGENT_ID:-pm-second-brain}
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across `up`/`down` for its sessions and state.
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  agent-home:
